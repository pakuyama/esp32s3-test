<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XIAO BLE 대시보드</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d2330; --muted:#6b7280; --on:#f59e0b; --off:#d1d5db; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111318; --card:#1b1f27; --text:#e5e7eb; --muted:#9ca3af; --off:#374151; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:480px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:20px; display:flex; align-items:center; gap:6px; }
  .pill { width:8px; height:8px; border-radius:50%; background:var(--off); flex:none; }
  .pill.ok { background:var(--ok); } .pill.bad { background:var(--bad); }
  .card { background:var(--card); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .dot { width:56px; height:56px; border-radius:50%; background:var(--off); transition:.15s; }
  .dot.on { background:var(--on); box-shadow:0 0 24px var(--on); }
  .state { font-size:1.6rem; font-weight:600; }
  .btns { display:flex; gap:8px; margin-top:16px; }
  button { flex:1; padding:12px; font-size:1rem; border:0; border-radius:10px; cursor:pointer; background:var(--off); color:var(--text); }
  button.primary { background:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  .meta { color:var(--muted); font-size:.8rem; margin-top:8px; font-variant-numeric:tabular-nums; }
  .warn { background:#fef3c7; color:#92400e; border-radius:10px; padding:12px 14px; font-size:.85rem; margin-bottom:16px; display:none; }
</style>
</head>
<body>
<main>
  <h1>XIAO ESP32-S3 BLE 대시보드</h1>
  <div class="sub"><span class="pill" id="pill"></span><span id="conn">연결 안 됨</span></div>
  <div class="warn" id="warn">이 브라우저는 Web Bluetooth를 지원하지 않습니다. 안드로이드·PC는 Chrome 또는 Edge, 아이폰은 Bluefy 앱에서 열어 주세요.</div>

  <section class="card">
    <h2>블루투스</h2>
    <div class="btns" style="margin-top:0">
      <button class="primary" id="connectBtn" onclick="connect()">보드 연결</button>
      <button id="disconnectBtn" onclick="disconnect()" disabled>연결 끊기</button>
    </div>
  </section>

  <section class="card">
    <h2>LED</h2>
    <div class="row">
      <div class="state" id="ledText">-</div>
      <div class="dot" id="ledDot"></div>
    </div>
    <div class="btns">
      <button class="primary ctl" onclick="setLed(true)" disabled>켜기</button>
      <button class="ctl" onclick="setLed(false)" disabled>끄기</button>
    </div>
  </section>

  <section class="card">
    <h2>터치 센서 (D0)</h2>
    <div class="row">
      <div class="state" id="touchText">-</div>
      <div class="dot" id="touchDot"></div>
    </div>
    <div class="meta" id="touchMeta"></div>
  </section>
</main>
<script>
// Must match BLEControl/BLEControl.ino
const SERVICE_UUID = '6e400000-b5a3-f393-e0a9-e50e24dc0001';
const LED_UUID     = '6e400001-b5a3-f393-e0a9-e50e24dc0001';
const TOUCH_UUID   = '6e400002-b5a3-f393-e0a9-e50e24dc0001';

const $ = id => document.getElementById(id);
const text = new TextDecoder();
let device, ledChar, touchChar;

if (!navigator.bluetooth) {
  $('warn').style.display = 'block';
  $('connectBtn').disabled = true;
}

function status(msg, state) {
  $('conn').textContent = msg;
  $('pill').className = 'pill ' + (state || '');
}

function setConnected(on) {
  $('connectBtn').disabled = on;
  $('disconnectBtn').disabled = !on;
  document.querySelectorAll('.ctl').forEach(b => b.disabled = !on);
  if (!on) {
    $('ledText').textContent = '-'; $('ledDot').classList.remove('on');
    $('touchText').textContent = '-'; $('touchDot').classList.remove('on');
    $('touchMeta').textContent = '';
  }
}

function renderLed(on) {
  $('ledText').textContent = on ? '켜짐' : '꺼짐';
  $('ledDot').classList.toggle('on', on);
}

// Touch characteristic is text "touched,value", e.g. "1,25000"
function renderTouch(dataView) {
  const [touched, value] = text.decode(dataView).split(',');
  const on = touched === '1';
  $('touchText').textContent = on ? '터치됨' : '대기';
  $('touchDot').classList.toggle('on', on);
  $('touchMeta').textContent = `값 ${value} · ${new Date().toLocaleTimeString()}`;
}

async function connect() {
  try {
    status('보드 검색 중…');
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
    device.addEventListener('gattserverdisconnected', () => {
      status('연결 끊김', 'bad');
      setConnected(false);
    });
    status('연결 중…');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    ledChar = await service.getCharacteristic(LED_UUID);
    touchChar = await service.getCharacteristic(TOUCH_UUID);

    renderLed(text.decode(await ledChar.readValue()) === '1');
    renderTouch(await touchChar.readValue());
    touchChar.addEventListener('characteristicvaluechanged', e => renderTouch(e.target.value));
    await touchChar.startNotifications();

    status(`연결됨 · ${device.name}`, 'ok');
    setConnected(true);
  } catch (e) {
    // User closing the device picker is not an error worth shouting about
    status(e.name === 'NotFoundError' ? '연결 안 됨' : '오류: ' + e.message, e.name === 'NotFoundError' ? '' : 'bad');
    setConnected(false);
  }
}

function disconnect() {
  if (device?.gatt.connected) device.gatt.disconnect();
}

async function setLed(on) {
  try {
    await ledChar.writeValue(new TextEncoder().encode(on ? '1' : '0'));
    renderLed(on);
  } catch (e) {
    status('LED 전송 실패: ' + e.message, 'bad');
  }
}
</script>
</body>
</html>
